<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Check-in">
<meta name="theme-color" content="#ffffff">
<title>Check-in Manager</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#1a1a1a;min-height:100vh}
.topbar{background:#fff;border-bottom:1px solid #e5e5e5;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar h1{font-size:17px;font-weight:600}
.topbar-actions{display:flex;gap:8px}
.btn{font-size:13px;padding:7px 14px;border-radius:10px;border:1px solid #e0e0e0;background:#fff;color:#1a1a1a;cursor:pointer;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.btn:active{opacity:.7}
.btn-primary{background:#007AFF;color:#fff;border-color:#007AFF}
.btn-green{background:#34C759;color:#fff;border-color:#34C759}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px 16px}
.metric{background:#fff;border-radius:12px;padding:12px 14px;border:1px solid #e5e5e5}
.metric-label{font-size:11px;color:#888;margin-bottom:4px}
.metric-value{font-size:24px;font-weight:600}
.metric-value.blue{color:#007AFF}
.metric-value.green{color:#34C759}
.metric-value.orange{color:#FF9500}
.tabs{display:flex;background:#fff;border-bottom:1px solid #e5e5e5}
.tab{flex:1;padding:10px 8px;font-size:13px;font-weight:500;color:#888;border:none;background:none;cursor:pointer;border-bottom:2px solid transparent}
.tab.active{color:#007AFF;border-bottom-color:#007AFF}
.pane{display:none;padding:12px 16px}
.pane.active{display:block}
.search-bar{display:flex;gap:8px;margin-bottom:12px}
.search-bar input,.search-bar select{font-size:14px;padding:9px 12px;border-radius:10px;border:1px solid #e0e0e0;background:#fff;color:#1a1a1a;flex:1}
.booking-card{background:#fff;border-radius:12px;border:1px solid #e5e5e5;padding:14px;margin-bottom:10px}
.bc-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.bc-apt{font-size:15px;font-weight:600}
.bc-guest{font-size:13px;color:#555;margin-top:2px}
.bc-actions{display:flex;gap:6px}
.icon-btn{width:32px;height:32px;border-radius:8px;border:1px solid #e5e5e5;background:#f9f9f9;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px}
.icon-btn:active{opacity:.6}
.bc-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid #e0e0e0;background:#f5f5f5;color:#555;display:inline-flex;align-items:center;gap:3px}
.chip.green{background:#e8f8ed;border-color:#34C759;color:#1a7a3a}
.chip.blue{background:#e8f0ff;border-color:#007AFF;color:#0055cc}
.chip.orange{background:#fff3e0;border-color:#FF9500;color:#b35a00}
.chip.red{background:#ffe8e8;border-color:#FF3B30;color:#cc0000}
.doc-channels{margin-top:8px}
.doc-channels-label{font-size:11px;color:#888;margin-bottom:4px}
.doc-channels-row{display:flex;gap:5px;flex-wrap:wrap}
.ch-btn{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid #e0e0e0;background:#f5f5f5;color:#555;cursor:pointer}
.ch-btn.active{background:#e8f8ed;border-color:#34C759;color:#1a7a3a}
.special-tag{margin-top:8px;font-size:12px;background:#fff3e0;border-radius:8px;padding:5px 9px;color:#b35a00}
.today-banner{background:#e8f8ed;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:13px;color:#1a7a3a;font-weight:500}
.empty-state{text-align:center;padding:48px 16px;color:#999}
.status{font-size:12px;color:#888;padding:4px 16px 8px;min-height:24px;display:flex;align-items:center;gap:6px}
.spinner{width:12px;height:12px;border:2px solid #e0e0e0;border-top-color:#007AFF;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.card{background:#fff;border-radius:12px;border:1px solid #e5e5e5;padding:14px;margin-bottom:12px}
.card h3{font-size:14px;font-weight:600;margin-bottom:10px}
.card p{font-size:13px;color:#666;margin-bottom:10px;line-height:1.5}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:#888;margin-bottom:4px;font-weight:500}
.field input,.field select,.field textarea{width:100%;font-size:14px;padding:9px 12px;border-radius:10px;border:1px solid #e0e0e0;background:#fff;color:#1a1a1a;-webkit-appearance:none}
.field textarea{resize:vertical;min-height:70px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick-result{background:#f5f5f5;border-radius:10px;padding:12px;font-size:13px;line-height:1.8;margin-top:10px}
.quick-actions{display:flex;gap:8px;margin-top:8px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end}
.modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-height:90vh;overflow-y:auto;padding:16px;padding-bottom:32px}
.modal-handle{width:36px;height:4px;background:#e0e0e0;border-radius:2px;margin:0 auto 14px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-header h3{font-size:16px;font-weight:600}
.modal-footer{display:flex;gap:8px;margin-top:14px}
.modal-footer .btn{flex:1;justify-content:center;padding:12px}
.prenotazione-box{background:#f5f5f5;border-radius:10px;padding:10px;margin-bottom:12px;font-size:13px}
</style>
</head>
<body>

<div class="topbar">
  <h1>🏠 Check-in</h1>
  <div class="topbar-actions">
    <button class="btn" onclick="syncData()">🔄 Sync</button>
    <button class="btn btn-primary" onclick="openModal(null)">+ Nuovo</button>
  </div>
</div>

<div class="status" id="status"></div>
<div class="metrics" id="metrics"></div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('lista',this)">Lista</button>
  <button class="tab" onclick="switchTab('ical',this)">iCal</button>
</div>

<div id="pane-lista" class="pane active">
  <div class="search-bar">
    <input type="text" id="search" placeholder="🔍 Cerca..." oninput="renderList()">
    <select id="filterDoc" onchange="renderList()">
      <option value="">Tutti</option>
      <option value="missing">Doc mancanti</option>
      <option value="ok">Doc OK</option>
    </select>
  </div>
  <div id="todayBanner"></div>
  <div id="listContainer"></div>
</div>

<div id="pane-ical" class="pane">
  <div class="card">
    <h3>📅 Sincronizzazione iCal</h3>
    <p>Premi il pulsante per una sincronizzazione immediata di tutti i 50 appartamenti.</p>
    <button class="btn btn-primary" style="width:100%;justify-content:center;padding:12px" onclick="triggerIcalSync()">🔄 Sincronizza ora tutti i calendari</button>
    <div id="icalStatus" style="margin-top:10px;font-size:13px;color:#666"></div>
  </div>
  <div class="card">
    <h3>ℹ️ Appartamenti configurati</h3>
    <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:5px" id="aptList"></div>
  </div>
</div>

<div id="modalContainer"></div>

<script>
var API = 'https://script.google.com/macros/s/AKfycbygJZsYtsSIrH773yCc9MDQrhtcPuhnWe1on6S52d1gD0z1MSIkOMuxv3AMepp4tq4t/exec';
var CLAUDE_API = 'https://api.anthropic.com/v1/messages';
var bookings = [];

var APTS = ["1993","Abbacala1","Abbacala2","Pescatore","Naiade","Sughero","Luxury","Barsotti","Elena","Federico","Gabriella","Gina","Lella","Mariuccia","Mila","Paradiso","Remo","Stellario","Pietro","Gelsomino","Torretta","Luxury2","Grazioso appartamento","Balconcino del borgo","Coro","Mazzocchio","Nido","Giotto","Kino","Lucia","Casina gialla","Casina nel borgo","Chiocciola","Corte rurale","Affresco","Finestra su anfiteatro","Mordini","Nami","Non per caso","Podere al basso","Green House","Tre finestre","Coselli","Villa angela","Fatima","Luciana","Antiqua valli turano","Antiqua valli cauta","Antiqua valli semia","Antiqua vallis selvans"];

document.getElementById('aptList').innerHTML = APTS.map(function(a) {
  return '<span class="chip">' + a + '</span>';
}).join('');

function setStatus(msg, spin) {
  var el = document.getElementById('status');
  el.innerHTML = (spin ? '<span class="spinner"></span> ' : '') + msg;
}

function callAPI(params, callback) {
  var url = API + '?' + Object.keys(params).map(function(k) {
    return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
  }).join('&');
  fetch(url)
    .then(function(r) { return r.json(); })
    .then(function(data) { callback(null, data); })
    .catch(function(e) { callback(e, null); });
}

function syncData() {
  setStatus('Sincronizzazione...', true);
  callAPI({action: 'getAll'}, function(err, data) {
    if (err || !Array.isArray(data)) {
      setStatus('Errore connessione. Verifica la Web App.');
      return;
    }
    bookings = data;
    setStatus('Aggiornato: ' + bookings.length + ' arrivi');
    renderMetrics();
    renderList();
  });
}

function triggerIcalSync() {
  var el = document.getElementById('icalStatus');
  el.innerHTML = '<span class="spinner"></span> Sincronizzazione in corso (1-2 min)...';
  callAPI({action: 'syncIcal'}, function(err, data) {
    if (err) { el.innerHTML = 'Errore nella sincronizzazione.'; return; }
    el.innerHTML = 'Completato: ' + (data.added||0) + ' nuovi, ' + (data.skipped||0) + ' gia presenti, ' + (data.errors||0) + ' errori.';
    syncData();
  });
}

function renderMetrics() {
  var total = bookings.length;
  var docsOk = bookings.filter(function(b) { return b['Stato doc'] === 'ok'; }).length;
  var today = new Date(); today.setHours(0,0,0,0);
  var todayArr = bookings.filter(function(b) {
    var d = new Date(b['Check-in']); d.setHours(0,0,0,0);
    return d.getTime() === today.getTime();
  }).length;
  var special = bookings.filter(function(b) { return b['Richieste speciali'] && b['Richieste speciali'].trim(); }).length;
  document.getElementById('metrics').innerHTML =
    '<div class="metric"><div class="metric-label">Arrivi totali</div><div class="metric-value">' + total + '</div></div>' +
    '<div class="metric"><div class="metric-label">Oggi</div><div class="metric-value blue">' + todayArr + '</div></div>' +
    '<div class="metric"><div class="metric-label">Doc ricevuti</div><div class="metric-value green">' + docsOk + '</div></div>' +
    '<div class="metric"><div class="metric-label">Richieste spec.</div><div class="metric-value orange">' + special + '</div></div>';
}

function renderList() {
  var q = (document.getElementById('search').value || '').toLowerCase();
  var fd = document.getElementById('filterDoc').value;
  var today = new Date(); today.setHours(0,0,0,0);

  var list = bookings.filter(function(b) {
    if (q && (b['Appartamento']||'').toLowerCase().indexOf(q) < 0 && (b['Ospite']||'').toLowerCase().indexOf(q) < 0) return false;
    if (fd && b['Stato doc'] !== fd) return false;
    return true;
  }).sort(function(a, b) { return new Date(a['Check-in']) - new Date(b['Check-in']); });

  var todayList = list.filter(function(b) {
    var d = new Date(b['Check-in']); d.setHours(0,0,0,0);
    return d.getTime() === today.getTime();
  });

  var bannerEl = document.getElementById('todayBanner');
  if (todayList.length) {
    bannerEl.innerHTML = '<div class="today-banner">Oggi ' + todayList.length + ' arrivo/i: ' + todayList.map(function(b) { return b['Appartamento']; }).join(', ') + '</div>';
  } else {
    bannerEl.innerHTML = '';
  }

  var el = document.getElementById('listContainer');
  if (!list.length) {
    el.innerHTML = '<div class="empty-state"><div style="font-size:48px">🏠</div><p>Nessun arrivo trovato</p></div>';
    return;
  }

  el.innerHTML = list.map(function(b) {
    var id = b['ID'];
    var ci = b['Check-in'] ? new Date(b['Check-in']).toLocaleDateString('it-IT', {day:'2-digit', month:'2-digit'}) : '—';
    var co = b['Check-out'] ? new Date(b['Check-out']).toLocaleDateString('it-IT', {day:'2-digit', month:'2-digit'}) : '—';
    var ciD = new Date(b['Check-in']); ciD.setHours(0,0,0,0);
    var isToday = ciD.getTime() === today.getTime();
    var isTomorrow = ciD.getTime() === today.getTime() + 86400000;
    var dayChip = isToday ? '<span class="chip green">oggi</span>' : isTomorrow ? '<span class="chip orange">domani</span>' : '';
    var docChip = b['Stato doc'] === 'ok' ? '<span class="chip green">Doc OK</span>' : '<span class="chip red">Doc mancanti</span>';
    var channels = (b['Canali doc']||'').split(',').map(function(s) { return s.trim(); }).filter(Boolean);
    var chBtns = ['Airbnb','Holidu','WhatsApp','Email'].map(function(ch) {
      var active = channels.indexOf(ch) >= 0;
      return '<button class="ch-btn' + (active ? ' active' : '') + '" onclick="toggleChannel(\'' + id + '\',\'' + ch + '\')">' + ch + '</button>';
    }).join('');
    var special = b['Richieste speciali'] && b['Richieste speciali'].trim() ?
      '<div class="special-tag">Richieste: ' + b['Richieste speciali'] + '</div>' : '';
    return '<div class="booking-card">' +
      '<div class="bc-header">' +
        '<div>' +
          '<div class="bc-apt">' + b['Appartamento'] + '</div>' +
          '<div class="bc-guest">' + (b['Ospite'] || 'Ospite da completare') + '</div>' +
        '</div>' +
        '<div class="bc-actions">' +
          '<div class="icon-btn" title="Aggiornamento rapido" onclick="openRapidoModal(\'' + id + '\')">🎤</div>' +
          '<div class="icon-btn" title="Modifica" onclick="openModal(\'' + id + '\')">✏️</div>' +
          '<div class="icon-btn" title="Elimina" onclick="deleteItem(\'' + id + '\')">🗑</div>' +
        '</div>' +
      '</div>' +
      '<div class="bc-meta">' +
        '<span class="chip">' + ci + ' → ' + co + '</span>' +
        (b['Ora arrivo'] ? '<span class="chip">Ore ' + b['Ora arrivo'] + '</span>' : '') +
        (b['Ospiti'] ? '<span class="chip">' + b['Ospiti'] + ' ospiti</span>' : '') +
        (b['Piattaforma'] ? '<span class="chip blue">' + b['Piattaforma'] + '</span>' : '') +
        dayChip + docChip +
      '</div>' +
      '<div class="doc-channels">' +
        '<div class="doc-channels-label">Documenti ricevuti via:</div>' +
        '<div class="doc-channels-row">' + chBtns + '</div>' +
      '</div>' +
      special +
    '</div>';
  }).join('');
}

function toggleChannel(id, ch) {
  var b = null;
  for (var i = 0; i < bookings.length; i++) { if (bookings[i]['ID'] === id) { b = bookings[i]; break; } }
  if (!b) return;
  var channels = (b['Canali doc']||'').split(',').map(function(s) { return s.trim(); }).filter(Boolean);
  var idx = channels.indexOf(ch);
  if (idx >= 0) channels.splice(idx, 1); else channels.push(ch);
  b['Canali doc'] = channels.join(',');
  b['Stato doc'] = channels.length > 0 ? 'ok' : 'missing';
  renderList();
  callAPI({action:'save', id:id, 'Canali doc':b['Canali doc'], 'Stato doc':b['Stato doc']}, function() {});
}

function deleteItem(id) {
  if (!confirm('Eliminare questo arrivo?')) return;
  bookings = bookings.filter(function(b) { return b['ID'] !== id; });
  renderList(); renderMetrics();
  callAPI({action:'delete', id:id}, function() { setStatus('Arrivo eliminato'); });
}

function switchTab(id, el) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.pane').forEach(function(p) { p.classList.remove('active'); });
  el.classList.add('active');
  document.getElementById('pane-' + id).classList.add('active');
}

// =============================================
// =============================================
// =============================================
// MODAL AGGIORNAMENTO RAPIDO con AI e dettatura
// =============================================
var _recognition = null;

function openRapidoModal(id) {
  var b = null;
  for (var i = 0; i < bookings.length; i++) { if (bookings[i]['ID'] === id) { b = bookings[i]; break; } }
  if (!b) return;
  window._rapidoId = id;
  window._rapidoBooking = b;

  var ci = b['Check-in'] ? new Date(b['Check-in']).toLocaleDateString('it-IT', {day:'2-digit', month:'2-digit', year:'numeric'}) : '—';
  window._rapidoChannels = (b['Canali doc']||'').split(',').map(function(s){return s.trim();}).filter(Boolean);

  var chBtns = ['Airbnb','Holidu','WhatsApp','Email'].map(function(ch) {
    var active = window._rapidoChannels.indexOf(ch) >= 0;
    return '<button class="ch-btn' + (active ? ' active' : '') + '" id="rch_' + ch + '" onclick="toggleRCh(\'' + ch + '\')">' + ch + '</button>';
  }).join('');

  var html = '<div class="modal-overlay" id="rapidoOverlay">' +
    '<div class="modal" onclick="event.stopPropagation()">' +
      '<div class="modal-handle"></div>' +
      '<div class="modal-header">' +
        '<h3>🎤 Aggiornamento rapido</h3>' +
        '<button class="btn" onclick="closeRapido()">✕</button>' +
      '</div>' +
      '<div class="prenotazione-box">' +
        '<strong>' + b['Appartamento'] + '</strong> · ' + (b['Ospite'] || 'Ospite da completare') + '<br>' +
        '<span style="color:#888">Check-in: ' + ci + (b['Ora arrivo'] ? ' · ore ' + b['Ora arrivo'] : '') + (b['Ospiti'] ? ' · ' + b['Ospiti'] + ' ospiti' : '') + '</span>' +
      '</div>' +
      '<div class="field">' +
        '<label>Ditta o scrivi cosa vuoi aggiornare</label>' +
        '<div style="display:flex;gap:8px;margin-bottom:6px">' +
          '<button class="btn" id="micBtn" onclick="toggleMic()" style="font-size:20px;padding:8px 14px">🎤</button>' +
          '<button class="btn" onclick="document.getElementById(\'rapido_input\').value=\'\'" style="padding:8px 12px">✕</button>' +
        '</div>' +
        '<textarea id="rapido_input" placeholder="Es: 4 persone, ore 15, documenti su WhatsApp, early check-in..." style="min-height:80px"></textarea>' +
      '</div>' +
      '<div class="field"><label>Documenti ricevuti via (tocca per aggiornare)</label>' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">' + chBtns + '</div>' +
      '</div>' +
      '<div id="rapido_result"></div>' +
      '<div class="modal-footer">' +
        '<button class="btn" onclick="closeRapido()">Annulla</button>' +
        '<button class="btn btn-primary" onclick="parseRapido()">✨ Interpreta</button>' +
      '</div>' +
    '</div>' +
  '</div>';

  document.getElementById('modalContainer').innerHTML = html;
  document.getElementById('rapidoOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeRapido();
  });
}

function toggleMic() {
  var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) { alert('Dettatura non supportata su questo browser. Usa Chrome.'); return; }
  var btn = document.getElementById('micBtn');
  if (_recognition) {
    _recognition.stop();
    _recognition = null;
    if (btn) btn.innerHTML = '🎤';
    return;
  }
  _recognition = new SpeechRecognition();
  _recognition.lang = 'it-IT';
  _recognition.continuous = false;
  _recognition.interimResults = false;
  _recognition.onstart = function() { if (btn) btn.innerHTML = '⏹'; };
  _recognition.onresult = function(e) {
    var transcript = e.results[0][0].transcript;
    var inp = document.getElementById('rapido_input');
    if (inp) inp.value = (inp.value ? inp.value + ' ' : '') + transcript;
  };
  _recognition.onend = function() {
    _recognition = null;
    if (btn) btn.innerHTML = '🎤';
  };
  _recognition.onerror = function() {
    _recognition = null;
    if (btn) btn.innerHTML = '🎤';
  };
  _recognition.start();
}

function toggleRCh(ch) {
  var idx = window._rapidoChannels.indexOf(ch);
  if (idx >= 0) window._rapidoChannels.splice(idx, 1); else window._rapidoChannels.push(ch);
  var btn = document.getElementById('rch_' + ch);
  if (btn) btn.className = 'ch-btn' + (window._rapidoChannels.indexOf(ch) >= 0 ? ' active' : '');
}

function parseRapido() {
  var inputEl = document.getElementById('rapido_input');
  if (!inputEl) return;
  var text = inputEl.value.trim();
  if (!text) { alert('Inserisci o detta del testo.'); return; }
  var b = window._rapidoBooking;
  var resEl = document.getElementById('rapido_result');
  resEl.innerHTML = '<div style="display:flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;color:#888"><span class="spinner"></span> Claude sta interpretando...</div>';

  var ctx = 'Appartamento: ' + b['Appartamento'] +
    ', Ospite: ' + (b['Ospite']||'vuoto') +
    ', Ora arrivo: ' + (b['Ora arrivo']||'vuota') +
    ', N ospiti: ' + (b['Ospiti']||'vuoto') +
    ', Piattaforma: ' + (b['Piattaforma']||'vuota') +
    ', Stato doc: ' + (b['Stato doc']||'missing') +
    ', Canali doc: ' + (b['Canali doc']||'vuoti') +
    ', Richieste speciali: ' + (b['Richieste speciali']||'nessuna');

  // Usa GET per evitare il problema CORS redirect di Apps Script
  var getUrl = API + '?action=parseText' +
    '&text=' + encodeURIComponent(text.slice(0, 500)) +
    '&ctx=' + encodeURIComponent(ctx.slice(0, 800));
  fetch(getUrl)
    .then(function(r) { return r.json(); })
    .then(function(resp) {
      if (resp.error) {
        var resEl2 = document.getElementById('rapido_result');
        if (resEl2) resEl2.innerHTML = '<div style="margin-top:8px;font-size:13px;color:#FF3B30">Errore: ' + resp.error + '</div>';
        return;
      }
      var parsed = resp.data;
      window._rapidoParsed = parsed;
      var lines = [];
      if (parsed['Ospite'] !== undefined) lines.push('Ospite: ' + parsed['Ospite']);
      if (parsed['Ora arrivo']) lines.push('Ora arrivo: ' + parsed['Ora arrivo']);
      if (parsed['Ospiti']) lines.push('N ospiti: ' + parsed['Ospiti']);
      if (parsed['Stato doc']) lines.push('Stato doc: ' + parsed['Stato doc']);
      if (parsed['Canali doc']) lines.push('Documenti via: ' + parsed['Canali doc']);
      if (parsed['Richieste speciali']) lines.push('Richieste: ' + parsed['Richieste speciali']);
      if (parsed['Note']) lines.push('Note: ' + parsed['Note']);
      var resEl3 = document.getElementById('rapido_result');
      if (resEl3) {
        resEl3.innerHTML = '<div class="quick-result"><strong>Campi da aggiornare:</strong><br>' + lines.join('<br>') + '</div>' +
          '<div class="quick-actions">' +
            '<button class="btn btn-green" style="flex:1;justify-content:center" onclick="confirmRapido()">✓ Conferma e salva</button>' +
            '<button class="btn" onclick="document.getElementById(\'rapido_result\').innerHTML=\'\'">Scarta</button>' +
          '</div>';
      }
    })
    .catch(function() {
      var resEl4 = document.getElementById('rapido_result');
      if (resEl4) resEl4.innerHTML = '<div style="margin-top:8px;font-size:13px;color:#FF3B30">Errore di connessione. Riprova.</div>';
    });
}

function confirmRapido() {
  var parsed = window._rapidoParsed;
  var b = window._rapidoBooking;
  var id = window._rapidoId;
  if (!parsed || !b || !id) return;
  var params = {action: 'save', id: id};
  var fields = ['Appartamento','Ospite','Check-in','Check-out','Ora arrivo','Ospiti','Piattaforma','Note'];
  for (var i = 0; i < fields.length; i++) {
    var k = fields[i];
    params[k] = parsed[k] !== undefined ? parsed[k] : (b[k] || '');
  }
  // Canali doc e stato doc: usa quelli del modal (tasti) oppure quelli interpretati
  if (parsed['Canali doc'] !== undefined) {
    params['Canali doc'] = parsed['Canali doc'];
    params['Stato doc'] = parsed['Canali doc'] ? 'ok' : 'missing';
  } else {
    params['Canali doc'] = window._rapidoChannels.join(',');
    params['Stato doc'] = window._rapidoChannels.length > 0 ? 'ok' : 'missing';
  }
  if (parsed['Richieste speciali'] !== undefined) {
    params['Richieste speciali'] = parsed['Richieste speciali'];
  } else {
    params['Richieste speciali'] = b['Richieste speciali'] || '';
  }
  closeRapido();
  setStatus('Salvataggio...', true);
  callAPI(params, function(err) {
    if (err) { setStatus('Errore salvataggio'); return; }
    setStatus('Aggiornato!');
    syncData();
  });
}

function closeRapido() {
  if (_recognition) { _recognition.stop(); _recognition = null; }
  document.getElementById('modalContainer').innerHTML = '';
}



// =============================================
// MODAL MODIFICA COMPLETA
// =============================================
function openModal(id) {
  var b = null;
  if (id) { for (var i = 0; i < bookings.length; i++) { if (bookings[i]['ID'] === id) { b = bookings[i]; break; } } }
  window._editId = id || null;
  window._editChannels = b && b['Canali doc'] ? b['Canali doc'].split(',').map(function(s) { return s.trim(); }).filter(Boolean) : [];
  var plats = ['—','Airbnb','Holidu','Booking','WhatsApp','Altro'];
  var html = '<div class="modal-overlay" id="editOverlay">' +
    '<div class="modal" onclick="event.stopPropagation()">' +
      '<div class="modal-handle"></div>' +
      '<div class="modal-header"><h3>' + (b ? 'Modifica' : 'Nuovo arrivo') + '</h3><button class="btn" onclick="closeModal()">✕</button></div>' +
      '<div class="field"><label>Appartamento *</label><input id="m_apt" value="' + (b&&b['Appartamento'] ? b['Appartamento'] : '') + '"></div>' +
      '<div class="field"><label>Ospite</label><input id="m_guest" value="' + (b&&b['Ospite'] ? b['Ospite'] : '') + '"></div>' +
      '<div class="row2">' +
        '<div class="field"><label>Check-in *</label><input type="date" id="m_ci" value="' + (b&&b['Check-in'] ? b['Check-in'] : '') + '"></div>' +
        '<div class="field"><label>Check-out</label><input type="date" id="m_co" value="' + (b&&b['Check-out'] ? b['Check-out'] : '') + '"></div>' +
      '</div>' +
      '<div class="row2">' +
        '<div class="field"><label>Ora arrivo</label><input type="time" id="m_time" value="' + (b&&b['Ora arrivo'] ? b['Ora arrivo'] : '') + '"></div>' +
        '<div class="field"><label>N ospiti</label><input type="number" id="m_guests" value="' + (b&&b['Ospiti'] ? b['Ospiti'] : '') + '" min="1"></div>' +
      '</div>' +
      '<div class="field"><label>Piattaforma</label><select id="m_plat">' + plats.map(function(p) { return '<option' + (b&&b['Piattaforma']===p?' selected':'') + '>' + p + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label>Stato doc</label><select id="m_doc"><option value="missing"' + ((!b||b['Stato doc']==='missing')?' selected':'') + '>Mancanti</option><option value="partial"' + (b&&b['Stato doc']==='partial'?' selected':'') + '>Parziali</option><option value="ok"' + (b&&b['Stato doc']==='ok'?' selected':'') + '>Ricevuti</option></select></div>' +
      '<div class="field"><label>Canali documenti</label><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px" id="mchBtns">' +
        ['Airbnb','Holidu','WhatsApp','Email'].map(function(ch) {
          var active = window._editChannels.indexOf(ch) >= 0;
          return '<button class="ch-btn' + (active?' active':'') + '" id="mch_' + ch + '" onclick="toggleMCh(\'' + ch + '\')">' + ch + '</button>';
        }).join('') +
      '</div></div>' +
      '<div class="field"><label>Richieste speciali</label><textarea id="m_special">' + (b&&b['Richieste speciali'] ? b['Richieste speciali'] : '') + '</textarea></div>' +
      '<div class="field"><label>Note interne</label><textarea id="m_notes">' + (b&&b['Note'] ? b['Note'] : '') + '</textarea></div>' +
      '<div class="modal-footer">' +
        '<button class="btn" onclick="closeModal()">Annulla</button>' +
        '<button class="btn btn-primary" onclick="saveModal()">Salva</button>' +
      '</div>' +
    '</div>' +
  '</div>';
  document.getElementById('modalContainer').innerHTML = html;
  document.getElementById('editOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });
}

function toggleMCh(ch) {
  var idx = window._editChannels.indexOf(ch);
  if (idx >= 0) window._editChannels.splice(idx, 1); else window._editChannels.push(ch);
  var btn = document.getElementById('mch_' + ch);
  if (btn) btn.className = 'ch-btn' + (window._editChannels.indexOf(ch) >= 0 ? ' active' : '');
}

function closeModal() {
  document.getElementById('modalContainer').innerHTML = '';
}

function saveModal() {
  var apt = document.getElementById('m_apt').value.trim();
  var ci = document.getElementById('m_ci').value;
  if (!apt || !ci) { alert('Inserisci almeno appartamento e check-in.'); return; }
  var plat = document.getElementById('m_plat').value;
  var params = {
    action: 'save',
    'Appartamento': apt,
    'Ospite': document.getElementById('m_guest').value.trim(),
    'Check-in': ci,
    'Check-out': document.getElementById('m_co').value,
    'Ora arrivo': document.getElementById('m_time').value,
    'Ospiti': document.getElementById('m_guests').value,
    'Piattaforma': plat === '—' ? '' : plat,
    'Stato doc': document.getElementById('m_doc').value,
    'Canali doc': window._editChannels.join(','),
    'Richieste speciali': document.getElementById('m_special').value.trim(),
    'Note': document.getElementById('m_notes').value.trim()
  };
  if (window._editId) params.id = window._editId;
  closeModal();
  setStatus('Salvataggio...', true);
  callAPI(params, function(err) {
    if (err) { setStatus('Errore'); return; }
    setStatus('Salvato!');
    syncData();
  });
}

renderMetrics();
syncData();
</script>
</body>
